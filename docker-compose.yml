version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nse_postgres
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finance_network

  redis:
    image: redis:7-alpine
    container_name: nse_redis
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - finance_network

  etl:
    build:
      context: .
      dockerfile: Dockerfile
      target: etl
    container_name: nse_etl_service
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-finance_db}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - STREAM_INTERVAL_SECONDS=${STREAM_INTERVAL_SECONDS:-5}
      - SIMULATION_MODE=${SIMULATION_MODE:-true}
      - EXCHANGE=${EXCHANGE:-NSE}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - finance_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: nse_api_service
    ports:
      - "${API_PORT_HOST:-8000}:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-finance_db}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - finance_network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    container_name: nse_streamlit_dashboard
    ports:
      - "${DASHBOARD_PORT_HOST:-8501}:8501"
    environment:
      - API_URL=${API_URL:-http://api:8000}
    depends_on:
      - api
    restart: always
    networks:
      - finance_network

volumes:
  postgres_data:
    driver: local

networks:
  finance_network:
    driver: bridge
